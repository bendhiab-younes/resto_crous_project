<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}Gestionnaire de menus et de recettes{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header>
    <a href="/">Gestionnaire de menus et de recettes</a>
    {% if request.state.utilisateur %}
    <nav>
      <a href="/ingredients">Ingrédients</a>
      <form method="post" action="/deconnexion">
        <button>Se déconnecter</button>
      </form>
    </nav>
    {% else %}
    <nav><a href="/connexion">Connexion</a></nav>
    {% endif %}
  </header>
  <main>
    {% block contenu %}{% endblock %}
  </main>
</body>
</html>
