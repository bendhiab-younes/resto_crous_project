{% extends "base.html" %}

{% block titre %}Connexion{% endblock %}

{% block contenu %}
<h1>Connexion</h1>
{% if erreur %}<p>{{ erreur }}</p>{% endif %}
<form method="post" action="/connexion">
  <p><label>Identifiant <input name="identifiant" required autofocus></label></p>
  <p><label>Mot de passe <input name="mot_de_passe" type="password" required></label></p>
  <button>Se connecter</button>
</form>
{% endblock %}
