{% extends "base.html" %}

{% block titre %}Connexion{% endblock %}

{% block contenu %}
<form class="connexion" method="post" action="/connexion">
  <h1>Connexion</h1>
  {% if erreur %}<p class="erreur" role="alert">{{ erreur }}</p>{% endif %}
  <p>
    <label for="identifiant">Identifiant
      <input id="identifiant" name="identifiant" autocomplete="username" required autofocus>
    </label>
  </p>
  <p>
    <label for="mot_de_passe">Mot de passe
      <input id="mot_de_passe" name="mot_de_passe" type="password" autocomplete="current-password" required>
    </label>
  </p>
  <button type="submit">Se connecter</button>
</form>
{% endblock %}
