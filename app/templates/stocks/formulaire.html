{% extends "base.html" %}

{% block contenu %}
<h1>Stock de {{ ingredient.nom }}</h1>
{% for champ, message in erreurs.items() %}
<p class="erreur">{{ message }}</p>
{% endfor %}
<form method="post">
  <label>
    Quantité disponible (g)
    <input name="quantite_disponible" value="{{ saisie.quantite_disponible }}">
  </label>
  <label>
    Seuil d'alerte (g)
    <input name="seuil_alerte" value="{{ saisie.seuil_alerte }}">
  </label>
  <button type="submit">Enregistrer</button>
</form>
{% endblock %}
